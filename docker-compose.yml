services:
  containerhub:
    image: ${CONTAINERHUB_IMAGE:-192.168.122.1:5000/containerhub:0.0.2}
    environment:
      DRAX_DB_ENGINE: mongo
      DRAX_MONGO_URI: ${CONTAINERHUB_MONGO_URI:-mongodb://mongo:27017/containerhub}
      DRAX_PORT: ${CONTAINERHUB_PORT:-9998}

      CONTAINERHUB_HOST_VOLUME_ROOTS: ${CONTAINERHUB_STORAGE_ROOT:-/storage},/logs,/localdata
      CONTAINERHUB_BOOTSTRAP_ENABLED: ${CONTAINERHUB_BOOTSTRAP_ENABLED:-false}
      CONTAINERHUB_BOOTSTRAP_NAME: ${CONTAINERHUB_BOOTSTRAP_NAME:-}
      CONTAINERHUB_BOOTSTRAP_USERNAME: ${CONTAINERHUB_BOOTSTRAP_USERNAME:-}
      CONTAINERHUB_BOOTSTRAP_EMAIL: ${CONTAINERHUB_BOOTSTRAP_EMAIL:-}
      CONTAINERHUB_BOOTSTRAP_PHONE: ${CONTAINERHUB_BOOTSTRAP_PHONE:-}


      TERMINAL_ALLOWED_ORIGIN: ${CONTAINERHUB_ORIGIN:-http://localhost:9998}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub

      CONTAINERHUB_AGENT_HOST: containerhub-agent
      CONTAINERHUB_AGENT_PORT: 9997

      CONTAINERHUB_VAULT_URL: ${CONTAINERHUB_VAULT_URL:-http://vault:5000}
      CONTAINERHUB_VAULT_CLIENT_ID: ${CONTAINERHUB_VAULT_CLIENT_ID:-containerhub}
      CONTAINERHUB_VAULT_CLIENT_KEY_FILE: /run/secrets/containerhub-vault-client-key
      CONTAINERHUB_VAULT_BOOTSTRAP_PASSWORD_SECRET_ID: ${CONTAINERHUB_VAULT_BOOTSTRAP_PASSWORD_SECRET_ID:-}
      REGISTRY_URL: ${REGISTRY_URL:-https://sndregistry.sondeosglobal.com/v2/}
      GITLAB_URL: ${GITLAB_URL:-http://git.snd.int/api/v4/}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    networks:
      - containerhub-agent-network
      - containerhub-mongo-network
    secrets:
      - containerhub-vault-client-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
      - ${CONTAINERHUB_STORAGE_ROOT:-/storage}:${CONTAINERHUB_STORAGE_ROOT:-/storage}
      - /logs:/logs
      - /localdata:/localdata
    ports:
      - target: ${CONTAINERHUB_PORT:-9998}
        published: ${CONTAINERHUB_PORT:-9998}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  containerhub-monitoring:
    image: ${CONTAINERHUB_IMAGE:-192.168.122.1:5000/containerhub:0.0.2}
    command: ["containerhub-monitoring"]
    environment:
      DRAX_DB_ENGINE: mongo
      DRAX_MONGO_URI: ${CONTAINERHUB_MONGO_URI:-mongodb://mongo:27017/containerhub}
      CONTAINERHUB_BOOTSTRAP_ENABLED: "false"
      TERMINAL_ALLOWED_ORIGIN: ${CONTAINERHUB_ORIGIN:-http://localhost:9998}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub
      CONTAINERHUB_AGENT_HOST: containerhub-agent
      CONTAINERHUB_AGENT_PORT: 9997
      CONTAINERHUB_VAULT_URL: ${CONTAINERHUB_VAULT_URL:-http://vault:5000}
      CONTAINERHUB_VAULT_CLIENT_ID: ${CONTAINERHUB_VAULT_CLIENT_ID:-containerhub}
      CONTAINERHUB_VAULT_CLIENT_KEY_FILE: /run/secrets/containerhub-vault-client-key
    networks:
      - containerhub-agent-network
      - containerhub-mongo-network
    secrets:
      - containerhub-vault-client-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  containerhub-agent:
    image: ${CONTAINERHUB_AGENT_IMAGE:-192.168.122.1:5000/containerhub-agent:latest}
    environment:
      CONTAINERHUB_AGENT_PORT: 9997
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub
      CONTAINERHUB_HOST_VOLUME_ROOTS: ${CONTAINERHUB_STORAGE_ROOT:-/storage},/logs,/localdata
      NODE_ID: "{{.Node.ID}}"
    networks:
      containerhub-agent-network:
        aliases:
          - containerhub-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
      - ${CONTAINERHUB_STORAGE_ROOT:-/storage}:${CONTAINERHUB_STORAGE_ROOT:-/storage}
      - /logs:/logs
      - /localdata:/localdata
    deploy:
      mode: global
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == worker
          - node.platform.os == linux

networks:
  containerhub-agent-network:
    driver: overlay
  containerhub-mongo-network:
    external: true
    name: ${CONTAINERHUB_MONGO_NETWORK:-dockerway_default}

volumes:
  containerhub-data:

secrets:
  containerhub-vault-client-key:
    external: true
