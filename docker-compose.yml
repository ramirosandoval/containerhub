services:
  app:
    image: ${CONTAINERHUB_IMAGE:-192.168.122.1:5000/containerhub:0.0.2}
    command:
      - sh
      - -eu
      - -c
      - |
        export DRAX_JWT_SECRET="$$(cat /run/secrets/containerhub-test-jwt)"
        export DRAX_APIKEY_SECRET="$$(cat /run/secrets/containerhub-test-api-key)"
        export CONTAINERHUB_BOOTSTRAP_PASSWORD="$$(cat /run/secrets/containerhub-test-bootstrap-password)"
        exec node packages/containerhub-back/dist/index.js
    environment:
      DRAX_DB_ENGINE: sqlite
      DRAX_SQLITE_FILE: /var/lib/containerhub/containerhub.sqlite
      DRAX_PORT: ${CONTAINERHUB_PORT:-9998}
      CONTAINERHUB_BOOTSTRAP_ENABLED: ${CONTAINERHUB_BOOTSTRAP_ENABLED:-true}
      CONTAINERHUB_BOOTSTRAP_NAME: ${CONTAINERHUB_BOOTSTRAP_NAME:-ContainerHub Test Administrator}
      CONTAINERHUB_BOOTSTRAP_USERNAME: ${CONTAINERHUB_BOOTSTRAP_USERNAME:-containerhub-test}
      CONTAINERHUB_BOOTSTRAP_EMAIL: ${CONTAINERHUB_BOOTSTRAP_EMAIL:-containerhub-test@example.invalid}
      CONTAINERHUB_BOOTSTRAP_PHONE: ${CONTAINERHUB_BOOTSTRAP_PHONE:-+15555550100}
      TERMINAL_ALLOWED_ORIGIN: ${CONTAINERHUB_ORIGIN:-http://localhost:9998}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub
      CONTAINERHUB_AGENT_HOST: containerhub-agent
      CONTAINERHUB_AGENT_PORT: 9997
    networks:
      - containerhub-agent-network
    secrets:
      - containerhub-test-jwt
      - containerhub-test-api-key
      - containerhub-test-bootstrap-password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
    ports:
      - target: 9998
        published: 9998
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  monitoring:
    image: ${CONTAINERHUB_IMAGE:-192.168.122.1:5000/containerhub:0.0.2}
    command:
      - sh
      - -eu
      - -c
      - |
        export DRAX_JWT_SECRET="$$(cat /run/secrets/containerhub-test-jwt)"
        export DRAX_APIKEY_SECRET="$$(cat /run/secrets/containerhub-test-api-key)"
        exec node packages/containerhub-back/dist/monitoring.js
    environment:
      DRAX_DB_ENGINE: sqlite
      DRAX_SQLITE_FILE: /var/lib/containerhub/containerhub.sqlite
      CONTAINERHUB_BOOTSTRAP_ENABLED: "false"
      TERMINAL_ALLOWED_ORIGIN: ${CONTAINERHUB_ORIGIN:-http://localhost:9998}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub
      CONTAINERHUB_AGENT_HOST: containerhub-agent
      CONTAINERHUB_AGENT_PORT: 9997
    networks:
      - containerhub-agent-network
    secrets:
      - containerhub-test-jwt
      - containerhub-test-api-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  agent:
    image: 192.168.122.1:5000/containerhub-agent:latest
    environment:
      CONTAINERHUB_AGENT_PORT: 9997
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_DATA_PATH: /var/lib/containerhub
      DRAX_SQLITE_FILE: /var/lib/containerhub/containerhub.sqlite
      NODE_ID: "{{.Node.ID}}"
    networks:
      containerhub-agent-network:
        aliases:
          - containerhub-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerhub-data:/var/lib/containerhub
    deploy:
      mode: global
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == worker
          - node.platform.os == linux

networks:
  containerhub-agent-network:
    driver: overlay

volumes:
  containerhub-data:

secrets:
  containerhub-test-jwt:
    external: true
  containerhub-test-api-key:
    external: true
  containerhub-test-bootstrap-password:
    external: true
