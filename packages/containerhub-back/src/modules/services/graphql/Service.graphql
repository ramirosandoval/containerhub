type Image {
  name: String!
  nameWithTag: String!
  namespace: String
  domain: String
  fullname: String
  tag: String
}

type Port {
  hostPort: Int
  containerPort: Int
  protocol: String
}

type Service {
  id: ID!
  name: String!
  stack: String
  image: Image
  ports: [Port]
  createdAt: String
  updatedAt: String
}

type ServicePage {
  page: Int!
  limit: Int!
  total: Int!
  items: [Service!]!
}

enum ServiceOrder { asc desc }

type ServiceWarning {
  Warnings: [String]
}

type RemoveResult {
  message: String
}

type Query {
  fetchService(stack: String): [Service]
  paginateServices(page: Int!, limit: Int!, orderBy: String, order: ServiceOrder, search: String, stack: String, filters: String): ServicePage!
  findServiceById(id: String!): Service
}

type Mutation {
  dockerRestart(serviceId: String!): ServiceWarning
  dockerRemove(serviceId: String!): RemoveResult
}
